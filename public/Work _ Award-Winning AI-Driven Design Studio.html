<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Work | Award-Winning AI-Driven Design Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --bg: #030308;
      --fg: #e9e9e9;
      --mut: #8b8b92;
      --line: rgba(255, 255, 255, .55);
      color-scheme: dark;
      box-sizing: border-box
    }

    :root:not([data-theme="light"]) {
      --bg: #030308
    }

    @media (prefers-color-scheme:dark) {
      :root:not([data-theme="light"]) {
        --bg: #030308
      }
    }

    :root[data-theme="dark"] {
      --bg: #030308
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    html {
      background: var(--bg);
      scroll-padding-top: env(safe-area-inset-top, 0px)
    }

    html.lenis,
    html.lenis body {
      height: auto
    }

    .lenis.lenis-smooth {
      scroll-behavior: auto !important
    }

    body {
      background: var(--bg);
      color: var(--fg);
      font-family: "Inter Tight", Helvetica, Arial, sans-serif;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased
    }

    canvas#gl {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none
    }

    header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 50;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: calc(env(safe-area-inset-top, 0px) + 22px) 29px 0;
      pointer-events: none
    }

    header>* {
      pointer-events: auto
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 5px;
      font-weight: 500;
      font-size: 19px;
      letter-spacing: -.03em;
      color: #fff;
      text-decoration: none
    }

    .brand svg {
      width: 20px;
      height: 18px
    }

    .brand sup {
      font-size: 7px;
      margin-left: 1px;
      align-self: flex-start;
      margin-top: 5px
    }

    .nav {
      display: flex;
      align-items: center;
      gap: 7px
    }

    .mute {
      width: 27px;
      height: 27px;
      border-radius: 50%;
      background: #16161b;
      display: grid;
      place-items: center;
      margin-right: 9px
    }

    .mute svg {
      width: 12px;
      height: 12px;
      fill: #777
    }

    .pill {
      height: 27px;
      padding: 0 14px;
      border-radius: 99px;
      font: 400 12.5px/27px "Inter Tight", sans-serif;
      text-transform: uppercase;
      letter-spacing: .01em;
      border: 1px solid #fff;
      color: #fff;
      background: none;
      cursor: pointer;
      transition: background .3s, color .3s
    }

    .pill.w {
      background: #fff;
      color: #000
    }

    .pill:hover {
      background: #fff;
      color: #000
    }

    .pill.w:hover {
      background: #000;
      color: #fff
    }

    .hero {
      height: 220vh;
      position: relative
    }

    .stick {
      position: sticky;
      top: 0;
      height: 100vh;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center
    }

    .logo-big {
      position: absolute;
      left: 50%;
      top: 40%;
      width: 190px;
      transform: translate(-50%, -50%)
    }

    .logo-big img {
      display: block;
      width: 100%;
      height: auto;
      user-select: none;
      -webkit-user-drag: none
    }

    .logo-big .dim {
      opacity: .5
    }

    .logo-big .fill {
      position: absolute;
      inset: 0;
      -webkit-mask-image: linear-gradient(to top, #000 calc(var(--lp, 0)*110% - 10%), transparent calc(var(--lp, 0)*110%));
      mask-image: linear-gradient(to top, #000 calc(var(--lp, 0)*110% - 10%), transparent calc(var(--lp, 0)*110%))
    }

    .stick h1 {
      position: absolute;
      top: 60%;
      left: 0;
      right: 0;
      transform: translateY(-50%);
      font-weight: 400;
      font-size: 68px;
      letter-spacing: -.055em;
      color: #d9d9d9;
      line-height: 1
    }

    .stick p {
      position: absolute;
      top: 67.5%;
      left: 0;
      right: 0;
      font-size: 14.5px;
      line-height: 1.1;
      letter-spacing: -.02em;
      color: #d0d0d0;
      max-width: 270px;
      margin: 0 auto
    }

    .list {
      position: relative;
      z-index: 2;
      padding: 0 0 38vh;
      margin-top: -6vh
    }

    .item {
      margin-top: 30vh
    }

    .item:first-child {
      margin-top: 38vh
    }

    .card {
      position: relative;
      display: block;
      border-radius: 6px;
      overflow: hidden;
      aspect-ratio: 780/545;
      cursor: none;
      background: #07070b
    }

    .card canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      will-change: transform
    }

    .l {
      margin-left: 4vw
    }

    .r {
      margin-left: auto;
      margin-right: 5vw
    }

    .c {
      margin: 0 auto
    }

    .meta {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-top: 30px
    }

    .meta h3 {
      font-weight: 400;
      font-size: 29px;
      letter-spacing: -.04em;
      color: #ececec;
      line-height: 1.1
    }

    .meta p {
      margin-top: 9px;
      font-size: 13px;
      line-height: 1.25;
      color: var(--mut);
      max-width: 255px;
      letter-spacing: -.01em
    }

    .go {
      margin-top: 6px;
      width: 185px;
      display: flex;
      justify-content: space-between;
      font: 500 10.5px "JetBrains Mono", monospace;
      letter-spacing: .02em;
      text-transform: uppercase;
      color: #fff;
      text-decoration: none;
      border-bottom: 1px solid #fff;
      padding-bottom: 4px;
      position: relative;
      overflow: hidden
    }

    .go i {
      font-style: normal;
      transition: transform .4s cubic-bezier(.2, .8, .2, 1)
    }

    .go:hover i {
      transform: translateX(5px)
    }

    .ring {
      position: fixed;
      left: 0;
      top: 0;
      width: 18px;
      height: 18px;
      margin: -9px 0 0 -9px;
      border: 1px solid rgba(255, 255, 255, .55);
      border-radius: 50%;
      z-index: 99;
      pointer-events: none
    }

    @media (max-width:760px) {
      .stick h1 {
        font-size: 44px
      }

      .card.l,
      .card.r,
      .card.c {
        width: 92vw !important;
        margin: 0 auto
      }

      .meta {
        flex-direction: column;
        gap: 16px
      }

      .item>* {
        width: 92vw !important;
        margin: 0 auto !important
      }

      .ring {
        display: none
      }

      .card {
        cursor: auto
      }
    }
  </style>
</head>

  <div class="ring"></div>

      </svg>TRIONN<sup>®</sup></a>

  </header>

        x.fillStyle = '#050505'; x.fillRect(0, 0, 780, 545); let g = x.createRadialGradient(330, 60, 5, 330, 230, 230); g.addColorStop(0, '#ff3a1c'); g.addColorStop(.55, '#9a1405'); g.addColorStop(1, 'rgba(0,0,0,0)'); x.fillStyle = g; poly(x, g, [[300, 0], [420, 0], [560, 300], [120, 300]]);
        x.fillStyle = '#c8c8c8'; x.fillRect(110, 296, 460, 3); x.fillStyle = '#111'; x.beginPath(); x.ellipse(335, 215, 16, 40, 0, 0, 7); x.fill(); rr(x, 500, 230, 90, 60, 4, '#2b2b2b');
        x.fillStyle = '#ece6da'; x.font = '300 41px Georgia,"Times New Roman",serif'; x.fillText('An Independent Music ♪ Studio Shaped', 20, 395); x.fillText('by Sound ◎, Built to Move Culture.', 20, 444)
      },
      loft(x) {
        grad(x, '#d9dbd9', '#7d817d', 1); x.fillStyle = 'rgba(255,255,255,.88)'; x.font = F(122, 500); x.fillText('LIVE LIFE', 48, 130); x.fillStyle = 'rgba(255,255,255,.4)'; x.fillText('IN LUXURY', 48, 232);
        x.fillStyle = '#e8e6e1'; x.fillRect(40, 300, 590, 14); poly(x, '#7a6a58', [[60, 314], [600, 314], [600, 400], [60, 400]]); x.fillStyle = '#8d8f88'; x.fillRect(60, 400, 260, 90); x.fillStyle = '#b9b6ae'; x.fillRect(330, 380, 270, 110);
        x.fillStyle = '#2f3d25';[[0, 520, 160], [200, 530, 120], [560, 510, 200], [700, 500, 120]].forEach(a => { x.beginPath(); x.ellipse(a[0], a[1], a[2], 70, 0, 0, 7); x.fill() }); rr(x, 90, 430, 160, 70, 6, '#f4f2ee'); rr(x, 590, 150, 100, 110, 5, '#e9e5de')
      },
      dfz(x) {
        let g = x.createRadialGradient(390, 260, 10, 390, 260, 420); g.addColorStop(0, '#3c3c3c'); g.addColorStop(1, '#050505'); x.fillStyle = g; x.fillRect(0, 0, 780, 545);
        ['#cfc58a', '#d6d09a', '#1f9a52', '#d77f7b', '#c98a52'].forEach((c, i) => { const cx = [165, 255, 390, 520, 615][i], cy = [255, 245, 230, 245, 258][i], r = [44, 46, 62, 46, 42][i]; x.fillStyle = '#7a7a7a'; x.fillRect(cx - r * .55, cy - r - 80, r * 1.1, r * 3.2); x.fillStyle = '#9a9a9a'; x.beginPath(); x.arc(cx, cy, r + 7, 0, 7); x.fill(); x.fillStyle = c; x.beginPath(); x.arc(cx, cy, r, 0, 7); x.fill() });
        x.fillStyle = '#bbb'; x.font = F(11, 400); x.fillText('DFZ', 365, 52); x.fillText('TIMEPIECE', 345, 115);
        let t = x.createLinearGradient(0, 380, 0, 545); t.addColorStop(0, '#8c8c8c'); t.addColorStop(1, 'rgba(40,40,40,.1)'); x.fillStyle = t; x.save(); x.scale(.84, 1); x.font = F(200, 500); x.fillText('DFZ WATCHES', 40, 520); x.restore()
      },
      domus(x) {
        let g = x.createRadialGradient(300, 230, 10, 390, 300, 520); g.addColorStop(0, '#8b6240'); g.addColorStop(1, '#140e0b'); x.fillStyle = g; x.fillRect(0, 0, 780, 545);
        poly(x, 'rgba(255,255,255,.07)', [[0, 300], [300, 150], [780, 250], [780, 380], [300, 520], [0, 420]]);
        x.fillStyle = '#f4efe6'; x.font = F(24, 400);[['D', 16], ['O', 142], ['M', 276], ['U', 409], ['S', 532]].forEach(a => x.fillText(a[0], a[1] + 18, 288));
        rr(x, 250, 215, 90, 130, 2, '#d8c4a6'); rr(x, 310, 235, 80, 110, 2, '#8a5a3a'); rr(x, 215, 250, 70, 100, 2, '#efe9df'); rr(x, 350, 265, 60, 70, 2, '#b88a5c')
      },
      rev(x) {
        grad(x, '#0f0d17', '#1d1428', 0); let g = x.createRadialGradient(370, 250, 5, 390, 260, 95); g.addColorStop(0, '#f0a0ff'); g.addColorStop(.5, '#9b3fd0'); g.addColorStop(1, '#2a0f45'); x.fillStyle = g; x.beginPath(); x.arc(390, 262, 86, 0, 7); x.fill();
        x.strokeStyle = 'rgba(255,255,255,.18)'; for (let i = -4; i < 5; i++) { x.beginPath(); x.ellipse(390, 262, 86, Math.abs(i) * 19 + 4, .4, 0, 7); x.stroke() }
        [[70, 60, 150, 100, 'Premium Traffic', 200], [500, 70, 140, 96, 'Brand Protection', 185], [70, 300, 150, 100, 'Audience Segments', 415], [490, 330, 150, 90, 'Advance Insights', 450]].forEach(a => { rr(x, a[0], a[1], a[2], a[3], 6, '#2a2a38'); x.fillStyle = '#ddd'; x.font = F(13); x.fillText(a[4], a[0] + (a[2] - x.measureText(a[4]).width) / 2, a[1] + a[3] + 22) })
      },
      fin(x) {
        grad(x, '#a9d6b6', '#eef5ee', 0); rr(x, 150, 50, 480, 430, 16, '#fafafa'); x.fillStyle = '#111'; x.font = F(22); x.fillText('My cards', 172, 118);
        rr(x, 172, 135, 140, 78, 10, '#c7f05e'); rr(x, 324, 135, 140, 78, 10, '#111'); rr(x, 476, 135, 134, 78, 10, '#ececec');
        for (let i = 0; i < 14; i++) { const h = 40 + ((i * 37) % 90) + i * 5; rr(x, 176 + i * 21, 455 - h, 10, h, 3, i % 3 == 1 ? '#111' : '#c7f05e') } rr(x, 428, 262, 182, 110, 10, '#e8f7bd'); rr(x, 428, 382, 182, 80, 10, '#111')
      },
      grad(x, a, b) { grad(x, a, b) },
      pink(x) { grad(x, '#f7b2d0', '#b8337f') }, sunset(x) { grad(x, '#e9a37c', '#2f2433', 1) }, blue(x) { grad(x, '#58a8ff', '#0a2a8a') }, purple(x) { grad(x, '#c06cf5', '#2a1250') }, coral(x) { grad(x, '#ff8a76', '#bf3838') }, dark(x) { grad(x, '#3a3020', '#0a0a0a') }
    };
    const mk = (k, w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; const x = c.getContext('2d'); x.scale(w / 780, h / 545); ART[k](x); return c };

    // ---------- boot ----------
    gsap.registerPlugin(ScrollTrigger);
    const lenis = new Lenis({ lerp: .085, wheelMultiplier: .9 });
    lenis.on('scroll', ScrollTrigger.update);
    gsap.ticker.add(t => lenis.raf(t * 1000)); gsap.ticker.lagSmoothing(0);
    const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
    const ORDER = [0, 7, 3, 10, 1, 12, 5, 8, 2, 9, 4, 13, 6, 11], logoEl = document.querySelector('.logo-big');

    const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('gl'), alpha: true, antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    const scene = new THREE.Scene(), cam = new THREE.OrthographicCamera(0, 1, 0, -1, .1, 100); cam.position.z = 10;
    const grp = new THREE.Group(); scene.add(grp);
    let W, H, segs = [], HP = 0, mx = 0, my = 0, tx = 0, ty = 0; const N = 90;

    const thumbs = TH.map((a, i) => { const m = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), new THREE.MeshBasicMaterial({ map: null, transparent: true })); m.userData = { x: a[1], y: a[2], w: a[3], z: a[4] }; m.userData.k = a[0]; scene.add(m); return m });

    function build() {
      W = innerWidth; H = innerHeight; renderer.setSize(W, H); cam.right = W; cam.bottom = -H; cam.updateProjectionMatrix();
      grp.children.slice().forEach(o => { grp.remove(o); o.geometry.dispose() }); segs = [];
      const sy = lenis.scroll || 0;
      const R = [...document.querySelectorAll('.card')].map(e => { const r = e.getBoundingClientRect(); return { x: r.left, y: r.top + sy - (parseFloat(gsap.getProperty(e, 'y')) || 0), w: r.width, h: r.height } });
      for (let i = -1; i < R.length - 1; i++) {
        const f = R[i], t = R[i + 1], B = { x: t.x + t.w / 2, y: t.y - 4 };
        const dir = i < 0 ? (B.x < W / 2 ? -1 : 1) : (B.x > f.x + f.w / 2 ? 1 : -1);
        const E = i < 0 ? { x: W / 2, y: H * 1.6 + 105 } : { x: dir > 0 ? f.x + f.w : f.x, y: f.y + f.h * .24 };
        const lines = [], pts = [];
        for (let k = 0; k < 3; k++) {
          const p0 = [E.x + (i < 0 ? (k - 1) * 16 : 0), E.y + k * 13], p1 = [p0[0] + dir * (300 + 110 * k), p0[1] + 90 + k * 40], p2 = [B.x + dir * (190 + 95 * k), B.y - 230 - k * 45];
          const pos = new Float32Array(N * 3), arr = [];
          for (let j = 0; j < N; j++) {
            const u = j / (N - 1), v = 1 - u, a = v * v * v, b = 3 * v * v * u, c = 3 * v * u * u, d = u * u * u;
            const X = a * p0[0] + b * p1[0] + c * p2[0] + d * B.x, Y = a * p0[1] + b * p1[1] + c * p2[1] + d * B.y; pos.set([X, -Y, 0], j * 3); arr.push([X, -Y])
          }
          const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
          const l = new THREE.Line(g, new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: .3 })); l.frustumCulled = false; grp.add(l); lines.push(l); pts.push(arr)
        }
        const dg = new THREE.BufferGeometry(); dg.setAttribute('position', new THREE.BufferAttribute(new Float32Array(9), 3));
        const dots = new THREE.Points(dg, new THREE.PointsMaterial({ size: 3.5, sizeAttenuation: false, color: 0xbdbdc4 })); dots.frustumCulled = false; grp.add(dots);
        const arcs = [0, 1].map(n => {
          const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(35 * 3), 3));
          const l = new THREE.Line(g, new THREE.LineBasicMaterial({ color: n ? 0xbfe0ff : 0x2f86ff, transparent: true, opacity: n ? 1 : .8 })); l.frustumCulled = false; l.visible = false; grp.add(l); return l
        });
        segs.push({ lines, pts, dots, arcs, y0: E.y, y1: B.y, hero: i < 0 })
      }
    }

    function frame(t) {
      const sc = lenis.scroll || 0;
      mx += (tx - mx) * .06; my += (ty - my) * .06;
      const n = thumbs.length; let fill = 0;
      thumbs.forEach((m, i) => {
        const d = m.userData, q = clamp((HP - ORDER[i] / n * .86) / .14), e = q * q * (3 - 2 * q); fill += e;
        let x = d.x * W + Math.sin(t * .6 + i) * 7 + mx * d.z * 30, y = d.y * H + Math.cos(t * .5 + i * 1.3) * 6 + my * d.z * 20;
        x += (W / 2 - x) * e; y += (H * .4 - y) * e; m.position.set(x, -(sc + y), 1);
        const s = d.w * W * (1 - .88 * e); m.scale.set(s, s / 1.43, 1);
        m.material.opacity = (.62 + .38 * Math.sin(t * .5 + i * 2)) * (1 - Math.pow(e, 6)); m.visible = e < .999
      });
      logoEl.style.setProperty('--lp', (fill / n).toFixed(4));
      segs.forEach(s => {
        const p = s.hero ? clamp((sc - H * 1.2) / (s.y1 - H * 1.95)) : clamp((sc + H * .85 - s.y0) / (s.y1 - s.y0 - H * .1)); const vis = p > 0;
        s.lines.forEach((l, k) => {
          l.visible = vis; if (!vis) return;
          const q = clamp(p * 1.12 - k * .06), n = Math.max(2, Math.round(q * (N - 1)) + 1); l.geometry.setDrawRange(0, n);
          const h = s.pts[k][n - 1], a = s.dots.geometry.attributes.position; a.setXYZ(k, h[0], h[1], 0)
        });
        s.dots.visible = vis; s.dots.geometry.attributes.position.needsUpdate = true;
        const on = p > .05 && p < .95; s.arcs.forEach((l, n) => {
          l.visible = on; if (!on) return;
          const a = s.dots.geometry.attributes.position, pos = l.geometry.attributes.position, amp = n ? 10 : 16;
          for (let g = 0; g < 2; g++) { const x0 = a.getX(g), y0 = a.getY(g), x1 = a.getX(g + 1), y1 = a.getY(g + 1), dx = x1 - x0, dy = y1 - y0, L = Math.hypot(dx, dy) || 1, nx = -dy / L, ny = dx / L; for (let j = 0; j < 18; j++) { if (g && !j) continue; const u = j / 17, o = (j == 0 || j == 17) ? 0 : (Math.random() - .5) * amp * Math.sin(Math.PI * u) * 2; pos.setXYZ(g * 17 + j, x0 + dx * u + nx * o, y0 + dy * u + ny * o, 0) } } pos.needsUpdate = true
        })
      });
      cam.position.y = -sc; renderer.render(scene, cam);
    }

    function init() {
      const list = document.getElementById('list');
      P.forEach((p, i) => {
        const it = document.createElement('article'); it.className = 'item';
        it.innerHTML = `<a class="card ${p.c}" href="#" style="width:${p.w}vw"></a><div class="meta ${p.c}" style="width:${p.w}vw"><div><h3>${p.t}</h3><p>${p.d}</p></div><a class="go" href="#">Explore project <i>→</i></a></div>`;
        const cv = mk(p.k, 780, 545); it.querySelector('.card').appendChild(cv);
        const mm = it.querySelector('.meta'); mm.style.cssText += ';margin-left:' + getComputedStyle(it.querySelector('.card')).marginLeft;
        list.appendChild(it)
      });
      // meta alignment matches card
      document.querySelectorAll('.item').forEach((it, i) => { const m = it.querySelector('.meta'); m.classList.remove('l', 'r', 'c'); const c = P[i].c; m.style.margin = c == 'l' ? '30px 0 0 4vw' : c == 'r' ? '30px 5vw 0 auto' : '30px auto 0' });
      thumbs.forEach(m => { const c = mk(m.userData.k, 320, 224); const tx_ = new THREE.CanvasTexture(c); m.material.map = tx_; m.material.needsUpdate = true });

      // hero convergence (scrubbed)
      ScrollTrigger.create({ trigger: '.hero', start: 'top top', end: () => '+=' + (innerHeight * 1.2), scrub: .6, onUpdate: s => { HP = s.progress } });
      gsap.from('.stick h1', { opacity: 0, y: 30, duration: 1.2, ease: 'power3.out', delay: .2 });
      // card reveals + image parallax + captions
      document.querySelectorAll('.item').forEach(it => {
        const card = it.querySelector('.card'), cv = card.querySelector('canvas');
        gsap.from(card, { opacity: 0, y: 90, filter: 'brightness(.15)', duration: 1.4, ease: 'power3.out', scrollTrigger: { trigger: card, start: 'top 82%' } });
        gsap.fromTo(cv, { scale: 1.16 }, { scale: 1, ease: 'none', scrollTrigger: { trigger: card, start: 'top bottom', end: 'bottom top', scrub: true } });
        gsap.from(it.querySelectorAll('.meta h3,.meta p,.go'), { opacity: 0, y: 24, duration: 1, stagger: .09, ease: 'power3.out', scrollTrigger: { trigger: it.querySelector('.meta'), start: 'top 92%' } });
      });
      // cursor ring
      const ring = document.querySelector('.ring'), qx = gsap.quickTo(ring, 'x', { duration: .45, ease: 'power3' }), qy = gsap.quickTo(ring, 'y', { duration: .45, ease: 'power3' });
      qx(innerWidth / 2); qy(innerHeight * .88);
      addEventListener('pointermove', e => { qx(e.clientX); qy(e.clientY); tx = e.clientX / innerWidth * 2 - 1; ty = e.clientY / innerHeight * 2 - 1 });
      document.querySelectorAll('.card').forEach(c => { c.addEventListener('pointerenter', () => gsap.to(ring, { scale: 3.2, backgroundColor: 'rgba(255,255,255,.12)', duration: .4 })); c.addEventListener('pointerleave', () => gsap.to(ring, { scale: 1, backgroundColor: 'rgba(255,255,255,0)', duration: .4 })) });
      document.querySelectorAll('a[href="#"]').forEach(a => a.addEventListener('click', e => e.preventDefault()));
      build(); ScrollTrigger.refresh(); gsap.ticker.add(frame);
      let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { ScrollTrigger.refresh(); build() }, 200) });
      addEventListener('load', () => { ScrollTrigger.refresh(); build() });
    }
    document.fonts.ready.then(init);
  </script>
